events {
    worker_connections  8000;  ## Default: 1024
    multi_accept on;
    use epoll;  # Efficient connection handling for Linux
}

# Worker process configuration for production
worker_processes auto;  # Auto-detect number of CPUs
worker_rlimit_nofile 20000;

http {
  include    /etc/nginx/mime.types;
  index    index.html index.htm;

  # DNS resolver for Docker internal DNS
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 10s;

  # SSL configuration for production
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Optimize for clustered backend
  # upstream backend_cluster {
  #   # Backend load balancing for multiple workers
  #   server backend:9000 max_fails=3 fail_timeout=30s;
  #   keepalive 32;  # Keep connections alive
  # }

  # Gzip compression configuration
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # Request and response optimization
  client_max_body_size 200M;
  client_body_buffer_size 128k;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;

  # Timeouts optimized for clustering
  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  proxy_buffering on;
  proxy_buffer_size 8k;
  proxy_buffers 16 8k;
  proxy_busy_buffers_size 16k;

  default_type application/octet-stream;
  log_format   main '$remote_addr - $remote_user [$time_local]  $status '
    '"$request" $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log   /etc/nginx/logs/access.log  main;
  sendfile     on;
  tcp_nopush   on;
  tcp_nodelay  on;
  server_names_hash_bucket_size 128;

  error_log /etc/nginx/logs/error.log warn;

  proxy_cache_path /etc/nginx/cache keys_zone=one:500m max_size=1000m;

  # ============================================================================
  # Frontend
  server {
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;

    server_name demo.eksicode.org;

    location / {
      set $frontend_upstream frontend:3000;
      proxy_pass http://$frontend_upstream;
      client_max_body_size 200M;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_buffers 16 16k;
      proxy_buffer_size 32k;
      proxy_read_timeout 300;
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
    }

    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;


    ssl_certificate /etc/nginx/eksicode.crt;
    ssl_certificate_key /etc/nginx/eksicode.key;
  }

  # ============================================================================
  # Backend
  server {
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;

    server_name api-demo.eksicode.org;

    # Health check endpoint
    location /health {
      set $backend_upstream backend:9000;
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      access_log off;  # Don't log health checks
    }

    # Telegram Bot Webhook endpoint (OPTIONAL - enable if using webhooks)
    # To enable webhooks:
    # 1. Uncomment this location block
    # 2. Set TELEGRAM_WEBHOOK_URL in telegrambot/.env to https://api-demo.eksicode.org/telegram/webhook
    # 3. Ensure your bot is configured to listen for webhooks (not polling)
    # 4. Restart both telegrambot and nginx containers
    #
    # location /telegram/webhook {
    #   proxy_pass http://telegrambot:8080/webhook;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   
    #   # Security: Only allow Telegram's IP ranges
    #   # Update these IPs based on: https://core.telegram.org/bots/webhooks#the-short-version
    #   allow 149.154.160.0/20;
    #   allow 91.108.4.0/22;
    #   deny all;
    #   
    #   # Telegram webhook specific settings
    #   proxy_connect_timeout 10s;
    #   proxy_send_timeout 10s;
    #   proxy_read_timeout 10s;
    #   client_max_body_size 20M;
    #   
    #   # No caching for webhooks
    #   proxy_no_cache 1;
    #   proxy_cache_bypass 1;
    # }

    location / {
      set $backend_upstream backend:9000;
      proxy_pass http://$backend_upstream;
      client_max_body_size 200M;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      
      # Enable keepalive connections to backend
      proxy_set_header Connection "";
      
      # Optimize for clustered backend
      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 30s;
    }

    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/eksicode.crt;
    ssl_certificate_key /etc/nginx/eksicode.key;
  }

  # ============================================================================
  # Admin Panel
  server {
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;

    server_name admin-demo.eksicode.org;

    location / {
      set $admin_upstream admin:3001;
      proxy_pass http://$admin_upstream;
      client_max_body_size 200M;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_buffers 16 16k;
      proxy_buffer_size 32k;
      proxy_read_timeout 300;
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
      
      # Additional security headers for admin panel
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/eksicode.crt;
    ssl_certificate_key /etc/nginx/eksicode.key;
  }
  # Don't edit below this line
}