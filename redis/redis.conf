# Redis Configuration for EksiCode
# Queue system requires noeviction policy to prevent job loss

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Memory Management
maxmemory 2gb
maxmemory-policy noeviction

# Persistence - AOF (Append Only File)
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Persistence - RDB Snapshots
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice

# Performance
tcp-keepalive 300
timeout 0
